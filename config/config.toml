# herdr-neon-violet — config.toml
# macOS/Linux : ~/.config/herdr/config.toml
# Windows     : %APPDATA%\herdr\config.toml
# Apply without restart: `herdr server reload-config` (or prefix+shift+r)

onboarding = false

# ---------------------------------------------------------------------------
# Theme — deep night purple, neon violet accent, hot pink / cyan / yellow
# ---------------------------------------------------------------------------
[theme]
name = "dracula" # base theme; every token below overrides it

[theme.custom]
panel_bg      = "#130a1f"
sidebar_bg    = "#1a0e2c"
active_row_bg = "#2a1745"
selection_bg  = "#3b1d63"
surface_dim   = "#0f0819"
surface0      = "#21123a"
surface1      = "#2d1a4d"
overlay0      = "#5e4a80"
overlay1      = "#8a76ad"
text          = "#ece4ff"
subtext0      = "#b4a6d6"
accent        = "#c33cf0"
mauve         = "#c33cf0"
red           = "#ff1f6e"
peach         = "#ff9a3c"
yellow        = "#ffe600"
green         = "#39e6a2"
teal          = "#1fd1c9"
blue          = "#8b7bff"

[ui]
accent = "#c33cf0"

# Clipboard: drag (or double-click) to copy. Over SSH herdr sends OSC 52 to the
# outer terminal, so the text lands on the machine you are sitting at.
mouse_capture  = true
copy_on_select = true

# Show every agent, most urgent first (blocked > working > done > idle).
agent_panel_sort  = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
window_title = "{hostname}: {workspace}"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "agent", fg = "#c33cf0", bold = true }, { token = "machine", fg = "#1fd1c9" }, "workspace"],
  [{ token = "state_text", fg = "#ffe600" }, { token = "terminal_title_stripped", dim = true }],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [{ token = "branch", fg = "#ff1f6e" }, "git_status"],
]

[ui.toast]
delivery = "herdr"

[ui.toast.clipboard]
enabled  = true
position = "bottom-center"

# ---------------------------------------------------------------------------
# Keys
# ---------------------------------------------------------------------------
[keys]
previous_agent = "prefix+comma"     # prefix+,  jump to previous agent
next_agent     = "prefix+period"    # prefix+.  jump to next agent
focus_agent    = "prefix+alt+1..9"  # prefix+alt+N  jump to agent N

# ALL agents board (neon-violet plugin)
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "neon-violet.all_agents"
description = "ALL agents board"

# Devices: adb devices, emulators, iOS simulators (neon-violet plugin)
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "neon-violet.devices"
description = "devices"

# In-terminal browser (neon-violet plugin)
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "neon-violet.browse"
description = "browser"
